<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪食蛇4.0 - 排行榜优化版</title>
    <style>
        /* 样式与您提供的代码完全相同，为节省篇幅此处省略，实际使用时请保留完整样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #ff9a00, #ff0080);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: #a0a0c0;
            margin-bottom: 25px;
        }
        
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            max-width: 800px;
            width: 100%;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 15px;
        }
        
        .score-container, .high-score-container, .level-container {
            text-align: center;
            flex: 1;
        }
        
        .info-label {
            font-size: 1rem;
            color: #a0a0c0;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 2.2rem;
            font-weight: bold;
            color: #4dffea;
        }
        
        .game-area {
            position: relative;
            margin-bottom: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        #game-canvas {
            border-radius: 8px;
            background-color: #0d1b2a;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }
        
        .directional-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
            width: 100%;
            max-width: 300px;
        }
        
        .dir-btn {
            background-color: rgba(77, 255, 234, 0.2);
            border: 2px solid rgba(77, 255, 234, 0.5);
            border-radius: 8px;
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            aspect-ratio: 1/1;
            transition: all 0.2s ease;
        }
        
        .dir-btn:hover {
            background-color: rgba(77, 255, 234, 0.3);
        }
        
        .dir-btn:active {
            background-color: rgba(77, 255, 234, 0.4);
            transform: scale(0.95);
        }
        
        .up-btn {
            grid-column: 2;
            grid-row: 1;
        }
        
        .left-btn {
            grid-column: 1;
            grid-row: 2;
        }
        
        .right-btn {
            grid-column: 3;
            grid-row: 2;
        }
        
        .down-btn {
            grid-column: 2;
            grid-row: 3;
        }
        
        .center-btn {
            grid-column: 2;
            grid-row: 2;
            background-color: transparent;
            border: none;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            width: 100%;
        }
        
        .btn {
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 150px;
            max-width: 200px;
        }
        
        #start-btn {
            background: linear-gradient(90deg, #00b09b, #96c93d);
            color: white;
        }
        
        #pause-btn {
            background: linear-gradient(90deg, #ff9a00, #ff0080);
            color: white;
        }
        
        #restart-btn {
            background: linear-gradient(90deg, #8a2be2, #4a00e0);
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .player-name-container {
            margin-bottom: 20px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 15px;
            display: none;
        }
        
        .player-name-container.show {
            display: block;
        }
        
        .player-name-input {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .player-name-input label {
            font-size: 1.1rem;
            color: #a0a0c0;
            white-space: nowrap;
        }
        
        .player-name-input input {
            flex-grow: 1;
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid rgba(77, 255, 234, 0.3);
            background-color: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 1rem;
        }
        
        .player-name-input input:focus {
            outline: none;
            border-color: #4dffea;
        }
        
        .name-change-container {
            display: none;
            margin-top: 20px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 15px;
        }
        
        .name-change-container.show {
            display: block;
        }
        
        .name-change-input {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .name-change-input input {
            flex-grow: 1;
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid rgba(77, 255, 234, 0.3);
            background-color: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 1rem;
        }
        
        .name-change-input input:focus {
            outline: none;
            border-color: #4dffea;
        }
        
        .name-change-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .name-change-buttons .btn {
            padding: 8px 16px;
            font-size: 1rem;
            min-width: 100px;
            max-width: 120px;
        }
        
        #save-name-btn {
            background: linear-gradient(90deg, #00b09b, #96c93d);
            color: white;
        }
        
        #cancel-name-btn {
            background: linear-gradient(90deg, #6c757d, #495057);
            color: white;
        }
        
        .leaderboard-container {
            width: 100%;
            margin-top: 20px;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 20px;
            display: none;
        }
        
        .leaderboard-container.show {
            display: block;
        }
        
        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .leaderboard-header h3 {
            color: #ff9a00;
            font-size: 1.4rem;
        }
        
        #toggle-leaderboard {
            background-color: rgba(77, 255, 234, 0.2);
            color: #4dffea;
            border: none;
            border-radius: 5px;
            padding: 5px 15px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        
        #toggle-leaderboard:hover {
            background-color: rgba(77, 255, 234, 0.3);
        }
        
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .leaderboard-table th {
            text-align: left;
            padding: 12px 10px;
            color: #a0a0c0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 600;
        }
        
        .leaderboard-table td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .leaderboard-table tr:last-child td {
            border-bottom: none;
        }
        
        .leaderboard-table tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
        
        .rank {
            width: 60px;
            text-align: center;
            font-weight: bold;
            color: #ff9a00;
        }
        
        .player {
            color: #4dffea;
        }
        
        .score {
            text-align: right;
            font-weight: bold;
        }
        
        .date {
            color: #a0a0c0;
            font-size: 0.9rem;
            text-align: center;
        }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            z-index: 10;
            display: none;
        }
        
        .game-over h2 {
            font-size: 3rem;
            color: #ff4757;
            margin-bottom: 20px;
        }
        
        .game-over p {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #ff9a00;
        }
        
        .game-over-buttons {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        
        .game-over-buttons .btn {
            min-width: 140px;
        }
        
        #change-name-btn {
            background: linear-gradient(90deg, #8a2be2, #4a00e0);
            color: white;
        }
        
        .instructions {
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            margin-top: 15px;
        }
        
        .instructions h3 {
            color: #ff9a00;
            margin-bottom: 12px;
            font-size: 1.3rem;
        }
        
        .instructions p {
            margin-bottom: 8px;
            line-height: 1.5;
            color: #d0d0e0;
        }
        
        .key {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            padding: 2px 8px;
            font-family: monospace;
            font-weight: bold;
            margin: 0 3px;
        }
        
        @media (max-width: 768px) {
            .game-container {
                padding: 15px;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
            
            .directional-controls {
                display: grid;
            }
            
            .instructions p {
                font-size: 0.95rem;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .info-value {
                font-size: 1.8rem;
            }
            
            .game-over-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .name-change-input {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            
            .name-change-input input {
                width: 100%;
            }
            
            .name-change-buttons {
                justify-content: center;
                width: 100%;
            }
        }
        
        @media (max-width: 480px) {
            #game-canvas {
                width: 300px;
                height: 300px;
            }
            
            .player-name-input {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            
            .player-name-input input {
                width: 100%;
            }
            
            .leaderboard-table {
                font-size: 0.9rem;
            }
            
            .leaderboard-table th,
            .leaderboard-table td {
                padding: 8px 5px;
            }
        }
        
        @media (max-width: 350px) {
            #game-canvas {
                width: 250px;
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>贪食蛇4.0</h1>
        <p class="subtitle">排行榜优化版 - 每个玩家只显示最高分</p>
    </div>
    
    <div class="game-container">
        <div class="game-info">
            <div class="score-container">
                <div class="info-label">当前得分</div>
                <div class="info-value" id="score">0</div>
            </div>
            <div class="high-score-container">
                <div class="info-label">最高分</div>
                <div class="info-value" id="high-score">0</div>
            </div>
            <div class="level-container">
                <div class="info-label">等级</div>
                <div class="info-value" id="level">1</div>
            </div>
        </div>
        
        <div class="player-name-container" id="player-name-container">
            <div class="player-name-input">
                <label for="player-name">玩家名称:</label>
                <input type="text" id="player-name" placeholder="请输入您的游戏名称" maxlength="15">
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="game-canvas" width="600" height="450"></canvas>
            
            <div class="directional-controls">
                <button class="dir-btn up-btn" id="up-btn">↑</button>
                <button class="dir-btn left-btn" id="left-btn">←</button>
                <div class="center-btn"></div>
                <button class="dir-btn right-btn" id="right-btn">→</button>
                <button class="dir-btn down-btn" id="down-btn">↓</button>
            </div>
            
            <div class="game-over" id="game-over">
                <h2>游戏结束!</h2>
                <p>得分: <span id="final-score">0</span></p>
                <div class="game-over-buttons">
                    <button class="btn" id="restart-btn-2">重新开始</button>
                    <button class="btn" id="change-name-btn">修改名称</button>
                </div>
            </div>
        </div>
        
        <div class="name-change-container" id="name-change-container">
            <div class="name-change-input">
                <label for="new-player-name">新玩家名称:</label>
                <input type="text" id="new-player-name" placeholder="请输入新的游戏名称" maxlength="15">
            </div>
            <div class="name-change-buttons">
                <button class="btn" id="cancel-name-btn">取消</button>
                <button class="btn" id="save-name-btn">保存名称</button>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn" id="start-btn">开始游戏</button>
            <button class="btn" id="pause-btn">暂停游戏</button>
            <button class="btn" id="restart-btn">重新开始</button>
        </div>
        
        <div class="leaderboard-container" id="leaderboard-container">
            <div class="leaderboard-header">
                <h3>🏆 排行榜 (前十名 - 每人仅显示最高分)</h3>
                <button id="toggle-leaderboard">收起</button>
            </div>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th class="rank">排名</th>
                        <th class="player">玩家</th>
                        <th class="score">最高分</th>
                        <th class="date">达成日期</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- 排行榜内容将通过JavaScript动态生成 -->
                </tbody>
            </table>
        </div>
        
        <div class="instructions">
            <h3>游戏说明</h3>
            <p>使用 <span class="key">方向键</span>、<span class="key">WASD</span> 或 <span style="color:#4dffea">下方方向按钮</span> 控制蛇的移动</p>
            <p>每吃到一个食物 <span style="color:#ff9a00">●</span> 获得10分，每得100分升一级</p>
            <p>等级越高，蛇移动速度越快</p>
            <p>避免撞到墙壁或自己的身体</p>
            <p>首次游戏请输入玩家名称，游戏结束后可以修改名称</p>
            <p><strong>新功能：</strong>排行榜每人只显示最高分，改名后会合并历史记录</p>
        </div>
    </div>

    <script>
        // 获取Canvas和Context
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        // 游戏变量
        let snake = [];
        let food = {};
        let direction = 'right';
        let nextDirection = 'right';
        let gameSpeed = 120;
        let gameInterval;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let level = 1;
        let gameRunning = false;
        let gamePaused = false;
        let playerName = localStorage.getItem('snakePlayerName') || '';
        let isFirstGame = !localStorage.getItem('snakePlayerName');
        let isInputFocused = false;
        let lastGameTimestamp = null;
        let gameRecordSaved = false;

        // 游戏元素尺寸
        const gridSize = 15;
        const gridWidth = canvas.width / gridSize;
        const gridHeight = canvas.height / gridSize;

        // DOM元素
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');
        const levelElement = document.getElementById('level');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const restartBtn = document.getElementById('restart-btn');
        const restartBtn2 = document.getElementById('restart-btn-2');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreElement = document.getElementById('final-score');
        const playerNameInput = document.getElementById('player-name');
        const playerNameContainer = document.getElementById('player-name-container');
        const leaderboardContainer = document.getElementById('leaderboard-container');
        const leaderboardBody = document.getElementById('leaderboard-body');
        const toggleLeaderboardBtn = document.getElementById('toggle-leaderboard');
        
        // 名称修改相关元素
        const changeNameBtn = document.getElementById('change-name-btn');
        const nameChangeContainer = document.getElementById('name-change-container');
        const newPlayerNameInput = document.getElementById('new-player-name');
        const saveNameBtn = document.getElementById('save-name-btn');
        const cancelNameBtn = document.getElementById('cancel-name-btn');

        // 移动控制按钮
        const upBtn = document.getElementById('up-btn');
        const downBtn = document.getElementById('down-btn');
        const leftBtn = document.getElementById('left-btn');
        const rightBtn = document.getElementById('right-btn');

        // ============== 修复1：移除initGame中的排行榜刷新 ==============
        function initGame() {
            // 初始化蛇
            snake = [
                {x: 5, y: 10},
                {x: 4, y: 10},
                {x: 3, y: 10}
            ];
            
            // 初始化方向
            direction = 'right';
            nextDirection = 'right';
            
            // 初始分数和等级
            score = 0;
            level = 1;
            gameSpeed = 120;
            
            // 重置游戏记录保存状态
            gameRecordSaved = false;
            
            // 更新显示
            scoreElement.textContent = score;
            levelElement.textContent = level;
            highScoreElement.textContent = highScore;
            
            // 生成第一个食物
            generateFood();
            
            // 隐藏游戏结束画面和名称修改界面
            gameOverScreen.style.display = 'none';
            nameChangeContainer.classList.remove('show');
            
            // 显示玩家名称输入（如果是第一次游戏）
            if (isFirstGame) {
                playerNameContainer.classList.add('show');
            } else {
                playerNameContainer.classList.remove('show');
            }
            
            // 显示排行榜
            leaderboardContainer.classList.add('show');
        }

        // 生成食物
        function generateFood() {
            food = {
                x: Math.floor(Math.random() * gridWidth),
                y: Math.floor(Math.random() * gridHeight)
            };
            
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    return generateFood();
                }
            }
        }

        // 绘制游戏元素
        function drawGame() {
            ctx.fillStyle = '#0d1b2a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            
            for (let x = 0; x <= canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            
            for (let y = 0; y <= canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            snake.forEach((segment, index) => {
                if (index === 0) {
                    ctx.fillStyle = '#4dffea';
                } else {
                    const colorValue = 150 + Math.floor(105 * (index / snake.length));
                    ctx.fillStyle = `rgb(50, ${colorValue}, 100)`;
                }
                
                drawRoundedRect(
                    segment.x * gridSize, 
                    segment.y * gridSize, 
                    gridSize - 1, 
                    gridSize - 1, 
                    3
                );
                
                if (index === 0) {
                    ctx.fillStyle = '#000';
                    
                    let eyeOffsetX = 0;
                    let eyeOffsetY = 0;
                    
                    if (direction === 'right') {
                        eyeOffsetX = 10;
                        eyeOffsetY = 4;
                    } else if (direction === 'left') {
                        eyeOffsetX = 4;
                        eyeOffsetY = 4;
                    } else if (direction === 'up') {
                        eyeOffsetX = 4;
                        eyeOffsetY = 4;
                    } else if (direction === 'down') {
                        eyeOffsetX = 4;
                        eyeOffsetY = 10;
                    }
                    
                    ctx.beginPath();
                    ctx.arc(
                        segment.x * gridSize + eyeOffsetX,
                        segment.y * gridSize + eyeOffsetY,
                        2, 0, Math.PI * 2
                    );
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.arc(
                        segment.x * gridSize + eyeOffsetX,
                        segment.y * gridSize + gridSize - eyeOffsetY,
                        2, 0, Math.PI * 2
                    );
                    ctx.fill();
                }
            });
            
            ctx.fillStyle = '#ff9a00';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize/2,
                food.y * gridSize + gridSize/2,
                gridSize/2 - 2, 0, Math.PI * 2
            );
            ctx.fill();
            
            ctx.shadowColor = '#ff9a00';
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // 绘制圆角矩形函数
        function drawRoundedRect(x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
        }

        // 更新游戏状态
        function updateGame() {
            direction = nextDirection;
            
            const head = {x: snake[0].x, y: snake[0].y};
            
            switch(direction) {
                case 'up':
                    head.y -= 1;
                    break;
                case 'down':
                    head.y += 1;
                    break;
                case 'left':
                    head.x -= 1;
                    break;
                case 'right':
                    head.x += 1;
                    break;
            }
            
            if (head.x < 0 || head.x >= gridWidth || head.y < 0 || head.y >= gridHeight) {
                gameOver();
                return;
            }
            
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }
            
            snake.unshift(head);
            
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }
                
                const newLevel = Math.floor(score / 100) + 1;
                if (newLevel > level) {
                    level = newLevel;
                    levelElement.textContent = level;
                    
                    gameSpeed = Math.max(50, 120 - (level - 1) * 10);
                    
                    if (gameRunning && !gamePaused) {
                        clearInterval(gameInterval);
                        gameInterval = setInterval(updateGame, gameSpeed);
                    }
                }
                
                generateFood();
            } else {
                snake.pop();
            }
            
            drawGame();
        }

        // 游戏结束
        function gameOver() {
            gameRunning = false;
            clearInterval(gameInterval);
            
            lastGameTimestamp = Date.now();
            
            finalScoreElement.textContent = score;
            gameOverScreen.style.display = 'flex';
            
            startBtn.textContent = '开始游戏';
            
            if (!gameRecordSaved) {
                saveGameRecord();
                gameRecordSaved = true;
            }
            
            loadLeaderboard();
        }

        // 保存游戏记录
        function saveGameRecord() {
            let name = playerName;
            if (isFirstGame && playerNameInput.value.trim()) {
                name = playerNameInput.value.trim().substring(0, 15);
                localStorage.setItem('snakePlayerName', name);
                playerName = name;
                isFirstGame = false;
                playerNameContainer.classList.remove('show');
            }
            
            if (!name) {
                name = "匿名玩家";
            }
            
            const now = new Date();
            const dateStr = now.toLocaleDateString('zh-CN');
            
            let history = JSON.parse(localStorage.getItem('snakeGameHistory') || '[]');
            
            history.push({
                player: name,
                score: score,
                level: level,
                date: dateStr,
                timestamp: now.getTime()
            });
            
            localStorage.setItem('snakeGameHistory', JSON.stringify(history));
        }

        // 改名后迁移所有历史记录
        function updateAllPlayerRecords(oldName, newName) {
            if (oldName === newName) return;
            
            let history = JSON.parse(localStorage.getItem('snakeGameHistory') || '[]');
            
            let updated = false;
            for (let i = 0; i < history.length; i++) {
                if (history[i].player === oldName) {
                    history[i].player = newName;
                    updated = true;
                }
            }
            
            if (updated) {
                localStorage.setItem('snakeGameHistory', JSON.stringify(history));
            }
        }

        // ============== 修复2：排行榜去重（每人只显示最高分）==============
        // ============== 这是之前被截断的完整函数 ==============
        function loadLeaderboard() {
            // 获取历史记录
            let history = JSON.parse(localStorage.getItem('snakeGameHistory') || '[]');
            
            // 创建玩家最高分映射
            const playerBestScores = new Map();
            
            // 遍历所有记录，找出每个玩家的最高分
            history.forEach(record => {
                const playerName = record.player;
                const currentBest = playerBestScores.get(playerName);
                
                if (!currentBest || record.score > currentBest.score) {
                    // 更新最高分记录
                    playerBestScores.set(playerName, {
                        player: playerName,
                        score: record.score,
                        date: record.date,
                        timestamp: record.timestamp
                    });
                }
            });
            
            // 将Map转换为数组并按分数排序
            let leaderboard = Array.from(playerBestScores.values());
            leaderboard.sort((a, b) => {
                if (a.score !== b.score) {
                    return b.score - a.score; // 高分优先
                } else {
                    return a.timestamp - b.timestamp; // 同分时先达到的优先
                }
            });
            
            // 只取前10名
            const top10 = leaderboard.slice(0, 10);
            
            // 清空排行榜表格
            leaderboardBody.innerHTML = '';
            
            if (top10.length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td colspan="4" style="text-align: center; color: #a0a0c0; padding: 30px;">
                        暂无游戏记录，快来成为第一名吧！
                    </td>
                `;
                leaderboardBody.appendChild(row);
                return;
            }
            
            // 填充排行榜
            top10.forEach((record, index) => {
                const row = document.createElement('tr');
                
                let rankClass = '';
                if (index === 0) rankClass = 'style="color: #ffd700;"';
                else if (index === 1) rankClass = 'style="color: #c0c0c0;"';
                else if (index === 2) rankClass = 'style="color: #cd7f32;"';
                
                row.innerHTML = `
                    <td class="rank" ${rankClass}>${index + 1}</td>
                    <td class="player">${record.player}</td>
                    <td class="score">${record.score}</td>
                    <td class="date">${record.date}</td>
                `;
                leaderboardBody.appendChild(row);
            });
        }

        // 修改玩家名称
        function changePlayerName() {
            nameChangeContainer.classList.add('show');
            gameOverScreen.style.display = 'none';
            
            newPlayerNameInput.value = playerName;
            newPlayerNameInput.focus();
            newPlayerNameInput.select();
        }

        // 保存新名称
        function saveNewPlayerName() {
            const newName = newPlayerNameInput.value.trim().substring(0, 15);
            
            if (!newName) {
                alert('请输入有效的玩家名称！');
                return;
            }
            
            const oldName = playerName;
            
            // 更新玩家名称
            playerName = newName;
            localStorage.setItem('snakePlayerName', playerName);
            
            // 迁移所有历史记录到新名字
            if (oldName) {
                updateAllPlayerRecords(oldName, newName);
            }
            
            // 更新最近一次游戏记录的时间戳
            if (lastGameTimestamp) {
                let history = JSON.parse(localStorage.getItem('snakeGameHistory') || '[]');
                for (let i = history.length - 1; i >= 0; i--) {
                    if (history[i].timestamp === lastGameTimestamp) {
                        history[i].player = newName;
                        break;
                    }
                }
                localStorage.setItem('snakeGameHistory', JSON.stringify(history));
            }
            
            // 隐藏名称修改界面，显示游戏结束界面
            nameChangeContainer.classList.remove('show');
            gameOverScreen.style.display = 'flex';
            
            // 重新加载排行榜
            loadLeaderboard();
            
            alert(`名称已从"${oldName}"更新为"${newName}"，所有历史记录已迁移`);
        }

        // 取消名称修改
        function cancelNameChange() {
            nameChangeContainer.classList.remove('show');
            gameOverScreen.style.display = 'flex';
        }

        // 开始游戏
        function startGame() {
            if (!gameRunning) {
                if (isFirstGame && !playerNameInput.value.trim()) {
                    alert('请输入玩家名称后再开始游戏！');
                    playerNameInput.focus();
                    return;
                }
                
                gameRunning = true;
                gamePaused = false;
                startBtn.textContent = '游戏中...';
                
                if (snake.length === 0) {
                    initGame();
                }
                
                gameInterval = setInterval(updateGame, gameSpeed);
                drawGame();
            }
        }

        // 暂停/继续游戏
        function togglePause() {
            if (!gameRunning) return;
            
            if (gamePaused) {
                gamePaused = false;
                pauseBtn.textContent = '暂停游戏';
                gameInterval = setInterval(updateGame, gameSpeed);
            } else {
                gamePaused = true;
                pauseBtn.textContent = '继续游戏';
                clearInterval(gameInterval);
            }
        }

        // 重新开始游戏
        function restartGame() {
            clearInterval(gameInterval);
            gameRunning = false;
            gamePaused = false;
            startBtn.textContent = '开始游戏';
            pauseBtn.textContent = '暂停游戏';
            initGame();
            drawGame();
        }

        // 键盘控制
        function handleKeyDown(e) {
            if (isInputFocused) {
                if (e.keyCode === 27) {
                    if (nameChangeContainer.classList.contains('show')) {
                        cancelNameChange();
                    }
                } else if (e.keyCode === 13 && nameChangeContainer.classList.contains('show')) {
                    saveNewPlayerName();
                }
                return;
            }
            
            if ([37, 38, 39, 40, 65, 87, 68, 83].includes(e.keyCode)) {
                e.preventDefault();
            }
            
            switch(e.keyCode) {
                case 38:
                case 87:
                    if (direction !== 'down') nextDirection = 'up';
                    break;
                case 40:
                case 83:
                    if (direction !== 'up') nextDirection = 'down';
                    break;
                case 37:
                case 65:
                    if (direction !== 'right') nextDirection = 'left';
                    break;
                case 39:
                case 68:
                    if (direction !== 'left') nextDirection = 'right';
                    break;
                case 32:
                    togglePause();
                    break;
                case 13:
                    if (!gameRunning) startGame();
                    break;
                case 82:
                    restartGame();
                    break;
            }
        }

        // 移动设备控制
        function setupMobileControls() {
            upBtn.addEventListener('click', () => {
                if (direction !== 'down') nextDirection = 'up';
            });
            
            downBtn.addEventListener('click', () => {
                if (direction !== 'up') nextDirection = 'down';
            });
            
            leftBtn.addEventListener('click', () => {
                if (direction !== 'right') nextDirection = 'left';
            });
            
            rightBtn.addEventListener('click', () => {
                if (direction !== 'left') nextDirection = 'right';
            });
        }

        // 切换排行榜显示
        toggleLeaderboardBtn.addEventListener('click', function() {
            if (leaderboardContainer.classList.contains('show')) {
                leaderboardContainer.classList.remove('show');
                this.textContent = '展开';
            } else {
                leaderboardContainer.classList.add('show');
                this.textContent = '收起';
            }
        });

        // 事件监听
        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', togglePause);
        restartBtn.addEventListener('click', restartGame);
        restartBtn2.addEventListener('click', restartGame);
        changeNameBtn.addEventListener('click', changePlayerName);
        saveNameBtn.addEventListener('click', saveNewPlayerName);
        cancelNameBtn.addEventListener('click', cancelNameChange);

        // 输入框焦点事件处理
        playerNameInput.addEventListener('focus', function() {
            isInputFocused = true;
        });
        
        playerNameInput.addEventListener('blur', function() {
            isInputFocused = false;
        });
        
        newPlayerNameInput.addEventListener('focus', function() {
            isInputFocused = true;
        });
        
        newPlayerNameInput.addEventListener('blur', function() {
            isInputFocused = false;
        });

        // 初始化游戏
        initGame();
        drawGame();
        
        // 设置移动控制
        setupMobileControls();
        
        // 监听键盘事件
        document.addEventListener('keydown', handleKeyDown);
        
        // 显示最高分
        highScoreElement.textContent = highScore;
        
        // 如果有保存的玩家名称，填充到输入框
        if (playerName) {
            playerNameInput.value = playerName;
        }
        
        // 添加触摸事件支持
        document.addEventListener('touchmove', function(e) {
            if (e.target.classList.contains('dir-btn')) {
                e.preventDefault();
            }
        }, { passive: false });
        
        // 点击页面其他地方收起排行榜
        document.addEventListener('touchstart', function(e) {
            if (!leaderboardContainer.contains(e.target) && 
                !toggleLeaderboardBtn.contains(e.target) &&
                leaderboardContainer.classList.contains('show')) {
                leaderboardContainer.classList.remove('show');
                toggleLeaderboardBtn.textContent = '展开';
            }
        });
    </script>
</body>
