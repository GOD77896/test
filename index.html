<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>活動報名小幫手 | 活動報名系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f0f7ff 0%, #e9eef5 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }

        /* 主容器 */
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 標題區域 */
        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }

        .hero h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .hero p {
            color: #4a627a;
            margin-top: 0.5rem;
            font-weight: 500;
        }

        /* 新增表單卡片 */
        .form-card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
            padding: 1.8rem 2rem;
            margin-bottom: 2rem;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .form-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e293b;
            border-left: 5px solid #3b82f6;
            padding-left: 1rem;
            margin-bottom: 1.5rem;
        }

        .form-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            margin-bottom: 1.8rem;
        }

        .input-group {
            flex: 1;
            min-width: 200px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #0f172a;
            font-size: 0.9rem;
        }

        .input-group label span {
            color: #ef4444;
            font-size: 0.8rem;
        }

        .input-group input, 
        .input-group select {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 20px;
            font-size: 0.95rem;
            transition: 0.2s;
            background: #fefefe;
        }

        .input-group input:focus, 
        .input-group select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }

        .btn-submit {
            background: #1e3c72;
            background: linear-gradient(95deg, #1e3c72, #2b4a8c);
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            box-shadow: 0 6px 14px rgba(0, 33, 68, 0.2);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            background: #0f2b4f;
            box-shadow: 0 12px 20px rgba(0,0,0,0.1);
        }

        /* 過濾器 + 統計 + 搜尋 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-radius: 60px;
            padding: 0.5rem 1rem;
            margin-bottom: 2rem;
            box-shadow: 0 5px 12px rgba(0,0,0,0.05);
            gap: 0.8rem;
        }

        .filter-buttons {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            color: #334155;
        }

        .filter-btn.active {
            background: #1e3c72;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        /* 搜尋框容器 */
        .search-box {
            flex: 1;
            min-width: 180px;
            display: flex;
            justify-content: center;
        }

        .search-box input {
            width: 100%;
            max-width: 300px;
            padding: 0.6rem 1.2rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 40px;
            font-size: 0.9rem;
            background: #f9fafb;
            transition: 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
            background: white;
        }

        .stats-info {
            background: #eef2ff;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1e293b;
            white-space: nowrap;
        }

        /* 卡片顯示區 (卡片樣式) */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.6rem;
        }

        .record-card {
            background: white;
            border-radius: 28px;
            padding: 1.4rem 1.2rem 1.2rem 1.5rem;
            box-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.12);
            transition: all 0.2s ease;
            border: 1px solid #eef2ff;
            position: relative;
            backdrop-filter: blur(2px);
        }

        .record-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 28px -12px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 0.5rem;
        }

        .activity-name {
            font-size: 1.3rem;
            font-weight: 800;
            color: #0c4e6e;
            word-break: break-word;
        }

        .status-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.3rem 0.7rem;
            border-radius: 50px;
            background: #e2e3e8;
            color: #2d3e5f;
        }

        .status-badge.done {
            background: #c7f9cc;
            color: #0a5c2e;
        }

        .status-badge.active {
            background: #ffe5b4;
            color: #b45309;
        }

        .card-detail {
            margin: 0.8rem 0;
        }

        .detail-item {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
        }

        .detail-label {
            font-weight: 700;
            min-width: 70px;
            color: #475569;
        }

        .detail-value {
            color: #1e293b;
            word-break: break-word;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .toggle-status-btn {
            background: none;
            border: 1px solid #cbd5e1;
            border-radius: 50px;
            padding: 0.4rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            background: #f8fafc;
        }

        .toggle-status-btn:hover {
            background: #eef2ff;
            transform: scale(0.97);
        }

        .delete-btn {
            background: #fff1f0;
            border: 1px solid #fecaca;
            border-radius: 50px;
            padding: 0.4rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #b91c1c;
            cursor: pointer;
            transition: 0.2s;
        }

        .delete-btn:hover {
            background: #fee2e2;
            border-color: #f87171;
        }

        .created-time {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 0.6rem;
            text-align: right;
        }

        .empty-message {
            text-align: center;
            grid-column: 1 / -1;
            padding: 3rem;
            background: #f1f5f9;
            border-radius: 48px;
            color: #5b6e8c;
            font-weight: 500;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
            .form-card {
                padding: 1.2rem;
            }
            .filter-bar {
                flex-direction: column;
                gap: 0.8rem;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem;
            }
            .search-box {
                order: -1; /* 手機版搜尋框置頂 */
            }
            .search-box input {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="hero">
        <h1>📋 活動報名 · 輕鬆管理</h1>
        <p>新增報名 | 狀態切換 | 即時篩選 | 搜尋活動 | Google Sheet 同步</p>
    </div>

    <!-- 新增表單區 -->
    <div class="form-card">
        <div class="form-title">✨ 新增報名資料</div>
        <div class="form-grid">
            <div class="input-group">
                <label>📌 活動名稱 <span>*</span></label>
                <input type="text" id="activityName" placeholder="例：秋季登山健行" autocomplete="off">
            </div>
            <div class="input-group">
                <label>🏷️ 活動類別 <span>*</span></label>
                <select id="activityCategory">
                    <option value="運動戶外">運動戶外</option>
                    <option value="音樂藝術">音樂藝術</option>
                    <option value="講座課程">講座課程</option>
                    <option value="志工服務">志工服務</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="input-group">
                <label>📝 備註 / 人數限制 (可填)</label>
                <input type="text" id="activityNote" placeholder="例如：限20人，需自備水壺">
            </div>
        </div>
        <div style="display: flex; justify-content: flex-end;">
            <button class="btn-submit" id="createBtn">➕ 新增報名</button>
        </div>
    </div>

    <!-- 過濾器及統計 + 搜尋 -->
    <div class="filter-bar">
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">📋 全部</button>
            <button class="filter-btn" data-filter="active">🟡 報名中 (active)</button>
            <button class="filter-btn" data-filter="done">✅ 已完成 (done)</button>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 搜尋活動名稱、類別或備註..." autocomplete="off">
        </div>
        <div class="stats-info" id="statsInfo">共 0 筆報名</div>
    </div>

    <!-- 卡片展示區 -->
    <div id="cardsContainer" class="cards-grid">
        <!-- 動態卡片會顯示在這裡 -->
        <div class="empty-message">✨ 目前沒有任何報名，請新增活動報名～</div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // Google Apps Script 後端 URL
    // --------------------------------------------------------------
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEhIUlRDN-KJvEMEtcHzyRXksnRYd4I0t69nPWhJMfuzEirvaxuBkxPxylaf85yhcv/exec";

    // --------------------------------------------------------------
    // Data Contract (前端鍵)
    // --------------------------------------------------------------
    // id, createdAt, status, activityName, category, note

    // --------------------------------------------------------------
    // 全域變數
    // --------------------------------------------------------------
    let records = [];
    let currentFilter = "all";
    let searchQuery = ""; // 新增：搜尋關鍵字

    // DOM
    const activityNameInput = document.getElementById("activityName");
    const activityCategorySelect = document.getElementById("activityCategory");
    const activityNoteInput = document.getElementById("activityNote");
    const createBtn = document.getElementById("createBtn");
    const cardsContainer = document.getElementById("cardsContainer");
    const statsInfo = document.getElementById("statsInfo");
    const searchInput = document.getElementById("searchInput"); // 新增

    // ---------- 輔助: 唯一 ID ----------
    function generateId() {
        return Date.now() + "_" + Math.random().toString(36).substring(2, 8);
    }

    // ---------- 1. createRecord ----------
    function createRecord(formData) {
        if (!formData.activityName || formData.activityName.trim() === "") {
            alert("請填寫活動名稱 (必填)");
            return null;
        }
        return {
            id: generateId(),
            createdAt: new Date().toISOString(),
            status: "active",
            activityName: formData.activityName.trim(),
            category: formData.category,
            note: formData.note || ""
        };
    }

    // ---------- 2. 本地儲存 (localStorage) ----------
    function saveData(record) {
        if (!record) return false;
        records.push(record);
        localStorage.setItem("records", JSON.stringify(records));
        return true;
    }

    function loadDataFromLocal() {
        const stored = localStorage.getItem("records");
        if (stored) {
            try {
                records = JSON.parse(stored);
                if (!Array.isArray(records)) records = [];
            } catch(e) {
                records = [];
            }
        } else {
            records = [];
        }
        return records;
    }

    // ---------- 3. Google Sheet 雙向對映 ----------
    // 後端 → 前端
    function normalizeRecord(raw) {
        // raw 的鍵是中文標頭，例如 { ID, 建立時間, 狀態, 活動名稱, 活動類別, 備註 }
        const map = {
            "ID": "id",
            "建立時間": "createdAt",
            "狀態": "status",
            "活動名稱": "activityName",
            "活動類別": "category",
            "備註": "note"
        };
        const record = {};
        Object.keys(raw).forEach(key => {
            const frontKey = map[key] || key; // 若無對映則保留原鍵
            record[frontKey] = raw[key];
        });
        return record;
    }

    // 前端 → 後端 (完整 record 或部分 changes)
    function toSheetRecord(frontendRecord) {
        const map = {
            "id": "ID",
            "createdAt": "建立時間",
            "status": "狀態",
            "activityName": "活動名稱",
            "category": "活動類別",
            "note": "備註"
        };
        const sheetRecord = {};
        Object.keys(frontendRecord).forEach(key => {
            const sheetKey = map[key] || key;
            sheetRecord[sheetKey] = frontendRecord[key];
        });
        return sheetRecord;
    }

    // ---------- 4. API 呼叫 ----------
    async function fetchRecordsFromSheet() {
        try {
            const res = await fetch(APPS_SCRIPT_URL);
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || "Fetch failed");
            return (data.records || []).map(normalizeRecord);
        } catch (err) {
            console.error("fetchRecordsFromSheet error:", err);
            throw err;
        }
    }

    async function syncToSheet(payload) {
        try {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || "Sync failed");
            return data;
        } catch (err) {
            console.error("syncToSheet error:", err);
            // 可在此觸發 UI 提示，但不中斷本地操作
            throw err;
        }
    }

    // ---------- 5. 更新本地 record ----------
    function updateRecord(id, changes) {
        const index = records.findIndex(record => record.id === id);
        if (index !== -1) {
            records[index] = { ...records[index], ...changes };
            localStorage.setItem("records", JSON.stringify(records));
            return true;
        }
        return false;
    }

    function deleteRecordById(id) {
        const newRecords = records.filter(record => record.id !== id);
        if (newRecords.length !== records.length) {
            records = newRecords;
            localStorage.setItem("records", JSON.stringify(records));
            return true;
        }
        return false;
    }

    // ---------- 6. 渲染 ----------
    function renderList(recordsToShow, customEmptyMessage) {
        cardsContainer.innerHTML = "";
        
        if (!recordsToShow || recordsToShow.length === 0) {
            const emptyDiv = document.createElement("div");
            emptyDiv.className = "empty-message";
            // 優先使用自訂訊息
            if (customEmptyMessage) {
                emptyDiv.innerText = customEmptyMessage;
            } else {
                emptyDiv.innerText = currentFilter === "all" ? "📭 目前沒有任何報名，請新增活動報名～" 
                                : (currentFilter === "active" ? "🟡 沒有進行中的報名，新增一筆吧！" : "✅ 沒有已完成報名，切換狀態試試～");
            }
            cardsContainer.appendChild(emptyDiv);
            updateStats();
            return;
        }
        
        for (let record of recordsToShow) {
            const card = document.createElement("div");
            card.className = "record-card";
            
            const statusDisplayText = record.status === "done" ? "✅ 已完成" : "🟡 報名中";
            const statusClass = record.status === "done" ? "status-badge done" : "status-badge active";
            
            let createdDateStr = "建立時間不明";
            try {
                const dateObj = new Date(record.createdAt);
                createdDateStr = `${dateObj.toLocaleDateString()} ${dateObj.toLocaleTimeString()}`;
            } catch(e) { createdDateStr = record.createdAt; }
            
            card.innerHTML = `
                <div class="card-header">
                    <div class="activity-name">${escapeHtml(record.activityName)}</div>
                    <div class="${statusClass}">${statusDisplayText}</div>
                </div>
                <div class="card-detail">
                    <div class="detail-item">
                        <span class="detail-label">🏷️ 類別：</span>
                        <span class="detail-value">${escapeHtml(record.category)}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">📝 備註：</span>
                        <span class="detail-value">${escapeHtml(record.note) || "— 無備註 —"}</span>
                    </div>
                </div>
                <div class="card-footer">
                    <button class="toggle-status-btn" data-id="${record.id}" data-status="${record.status}">
                        ${record.status === "active" ? "✔️ 標記為已完成" : "🔄 重啟報名"}
                    </button>
                    <button class="delete-btn" data-id="${record.id}">🗑️ 刪除</button>
                </div>
                <div class="created-time">
                    🕒 報名時間：${createdDateStr}
                </div>
            `;
            
            cardsContainer.appendChild(card);
        }
        
        // 綁定事件
        document.querySelectorAll(".toggle-status-btn").forEach(btn => {
            btn.addEventListener("click", async (e) => {
                e.stopPropagation();
                const id = btn.getAttribute("data-id");
                const currentStatus = btn.getAttribute("data-status");
                const newStatus = currentStatus === "active" ? "done" : "active";
                const success = updateRecord(id, { status: newStatus });
                if (success) {
                    applyFilterAndRender();
                    // 同步至 Sheet
                    try {
                        await syncToSheet({
                            action: "update",
                            id: id,
                            changes: toSheetRecord({ status: newStatus })
                        });
                    } catch (err) {
                        console.warn("狀態同步失敗，已保留本地修改", err);
                    }
                } else {
                    alert("更新狀態失敗");
                }
            });
        });
        
        document.querySelectorAll(".delete-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const id = btn.getAttribute("data-id");
                if (confirm("確定要刪除此筆報名嗎？")) {
                    deleteRecordById(id);
                    applyFilterAndRender();
                    // 注意：後端無 delete action，此處僅本地刪除
                }
            });
        });
        
        updateStats();
    }
    
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function applyFilterAndRender() {
        // 先依狀態過濾
        let filtered = [];
        if (currentFilter === "all") {
            filtered = [...records];
        } else if (currentFilter === "active") {
            filtered = records.filter(rec => rec.status === "active");
        } else if (currentFilter === "done") {
            filtered = records.filter(rec => rec.status === "done");
        }
        
        // 再依搜尋關鍵字過濾（不區分大小寫，比對名稱、類別、備註）
        if (searchQuery.trim() !== "") {
            const q = searchQuery.trim().toLowerCase();
            filtered = filtered.filter(rec => {
                const name = (rec.activityName || "").toLowerCase();
                const cat = (rec.category || "").toLowerCase();
                const note = (rec.note || "").toLowerCase();
                return name.includes(q) || cat.includes(q) || note.includes(q);
            });
        }
        
        // 準備自訂空訊息（當有搜尋關鍵字且結果為空時）
        let emptyMsg = null;
        if (filtered.length === 0 && searchQuery.trim() !== "") {
            emptyMsg = `🔍 找不到與「${searchQuery.trim()}」相關的活動`;
        }
        
        renderList(filtered, emptyMsg);
    }
    
    function updateStats() {
        const total = records.length;
        const activeCount = records.filter(r => r.status === "active").length;
        const doneCount = records.filter(r => r.status === "done").length;
        statsInfo.innerHTML = `📊 總共 ${total} 筆  |  🟡 報名中 ${activeCount}  |  ✅ 已完成 ${doneCount}`;
    }
    
    // ---------- 7. 表單處理 (含同步) ----------
    async function handleCreateRecord() {
        const activityName = activityNameInput.value;
        const category = activityCategorySelect.value;
        const note = activityNoteInput.value;
        
        const formData = { activityName, category, note };
        const newRecord = createRecord(formData);
        if (!newRecord) return;
        
        // 1. 本地樂觀更新
        saveData(newRecord);
        activityNameInput.value = "";
        activityNoteInput.value = "";
        applyFilterAndRender();
        
        // 2. 同步到 Google Sheet
        try {
            await syncToSheet({
                action: "create",
                record: toSheetRecord(newRecord)
            });
            console.log("新增已同步至 Google Sheet");
        } catch (err) {
            console.warn("同步失敗，資料已存於本地，稍後可手動同步", err);
        }
        
        if (currentFilter === "done") {
            const tip = document.createElement("div");
            tip.style.position = "fixed";
            tip.style.bottom = "20px";
            tip.style.left = "20px";
            tip.style.background = "#1e293b";
            tip.style.color = "white";
            tip.style.padding = "8px 16px";
            tip.style.borderRadius = "40px";
            tip.style.fontSize = "0.8rem";
            tip.style.zIndex = "999";
            tip.innerText = "✨ 新增成功！目前篩選為「已完成」，可切換至「全部」查看新報名";
            document.body.appendChild(tip);
            setTimeout(() => tip.remove(), 2500);
        }
    }
    
    // ---------- 8. 過濾器 ----------
    function bindFilterEvents() {
        const filterBtns = document.querySelectorAll(".filter-btn");
        filterBtns.forEach(btn => {
            btn.addEventListener("click", (e) => {
                const filterValue = btn.getAttribute("data-filter");
                if (filterValue) {
                    currentFilter = filterValue;
                    filterBtns.forEach(bt => bt.classList.remove("active"));
                    btn.classList.add("active");
                    applyFilterAndRender();
                }
            });
        });
    }
    
    // ---------- 9. 初始化 ----------
    async function init() {
        bindFilterEvents();
        createBtn.addEventListener("click", handleCreateRecord);
        activityNameInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                handleCreateRecord();
            }
        });
        
        // 搜尋框即時監聽
        searchInput.addEventListener("input", (e) => {
            searchQuery = e.target.value;
            applyFilterAndRender();
        });
        
        // 嘗試從 Google Sheet 載入資料
        try {
            const sheetRecords = await fetchRecordsFromSheet();
            records = sheetRecords;
            // 更新 localStorage 以保持一致性
            localStorage.setItem("records", JSON.stringify(records));
            console.log("從 Google Sheet 載入成功，共 " + records.length + " 筆");
        } catch (err) {
            console.warn("無法連接 Google Sheet，改由 localStorage 載入", err);
            loadDataFromLocal();
        }
        
        // 初始渲染
        applyFilterAndRender();
    }
    
    // 啟動
    init();
</script>
</body>
</html>
