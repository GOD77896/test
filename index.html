<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>活動報名小幫手 | 活動報名系統</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #dbeafe;
            --surface: #ffffff;
            --surface-hover: #f8fafc;
            --background: #f1f5f9;
            --text-main: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 12px 28px -8px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 24px 40px -12px rgba(0, 0, 0, 0.12);
            --radius-lg: 32px;
            --radius-xl: 40px;
            --radius-full: 9999px;
            --transition: 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: var(--background);
            min-height: 100vh;
            padding: 2.5rem 2rem;
            line-height: 1.6;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* 标题区域 */
        .hero {
            text-align: center;
            margin-bottom: 3rem;
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e3a8a 0%, var(--primary) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.8px;
            margin-bottom: 0.6rem;
        }

        .hero p {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 1.1rem;
            letter-spacing: 0.3px;
        }

        /* 表单卡片 */
        .form-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 2.2rem 2.5rem;
            margin-bottom: 2rem;
            transition: box-shadow var(--transition);
            border: 1px solid var(--border-light);
        }

        .form-card:hover {
            box-shadow: var(--shadow-lg);
        }

        .form-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
            border-left: 6px solid var(--primary);
            padding-left: 1.2rem;
            margin-bottom: 2rem;
        }

        .form-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            margin-bottom: 2rem;
        }

        .input-group {
            flex: 1;
            min-width: 220px;
        }

        .input-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 0.6rem;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .input-group label span {
            color: #ef4444;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 1rem 1.3rem;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            font-size: 0.95rem;
            transition: all var(--transition);
            background: var(--surface);
            box-shadow: var(--shadow-sm);
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
            background: #fff;
        }

        .btn-submit {
            background: linear-gradient(105deg, #1e3a8a, var(--primary-dark));
            border: none;
            padding: 1rem 2.5rem;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
            letter-spacing: 0.4px;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 28px rgba(37, 99, 235, 0.35);
        }

        .btn-submit:active {
            transform: translateY(0);
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.25);
        }

        /* 过滤栏 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            border-radius: var(--radius-xl);
            padding: 0.7rem 1.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-sm);
            gap: 1.2rem;
            border: 1px solid var(--border-light);
        }

        .filter-buttons {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: none;
            padding: 0.7rem 1.6rem;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition);
            color: var(--text-secondary);
            background: var(--surface-hover);
        }

        .filter-btn:hover {
            background: #e2e8f0;
            color: var(--text-main);
        }

        .filter-btn.active {
            background: var(--primary-dark);
            color: white;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25);
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            display: flex;
            justify-content: center;
        }

        .search-box input {
            width: 100%;
            max-width: 360px;
            padding: 0.8rem 1.5rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-full);
            font-size: 0.9rem;
            background: var(--surface);
            transition: all var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            background: white;
        }

        .sort-box select {
            padding: 0.7rem 2.5rem 0.7rem 1.2rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 500;
            background: var(--surface);
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23475569' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.8rem center;
            background-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .sort-box select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .stats-info {
            background: var(--primary-light);
            padding: 0.6rem 1.6rem;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary-dark);
            white-space: nowrap;
        }

        /* 可视化区域 */
        .visualization-section {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 2rem 2.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            display: flex;
            flex-wrap: wrap;
            gap: 2.5rem;
            align-items: flex-start;
        }

        .chart-block {
            flex: 1;
            min-width: 280px;
        }

        .chart-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 1.4rem;
            padding-left: 0.5rem;
            border-left: 4px solid var(--primary);
        }

        .bar-chart .bar-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.8rem;
            gap: 0.8rem;
        }

        .bar-label {
            width: 100px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-align: right;
        }

        .bar-track {
            flex: 1;
            height: 24px;
            background: #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--primary), #60a5fa);
            transition: width 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            min-width: 30px;
        }

        .bar-count {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            min-width: 30px;
        }

        .pie-chart canvas {
            display: block;
            margin: 0 auto;
            max-width: 200px;
        }

        .no-data-message {
            text-align: center;
            color: var(--text-muted);
            font-weight: 500;
            padding: 1rem;
            width: 100%;
        }

        /* 卡片网格 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2rem;
        }

        .record-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 1.8rem 1.8rem 1.5rem 2rem;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition);
            border: 1px solid var(--border-light);
            position: relative;
            overflow: hidden;
        }

        .record-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), #8b5cf6);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.35s ease;
        }

        .record-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
            border-color: #d1d5db;
        }

        .record-card:hover::before {
            transform: scaleX(1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border-light);
            padding-bottom: 0.7rem;
        }

        .activity-name {
            font-size: 1.4rem;
            font-weight: 800;
            color: #0c4a6e;
            word-break: break-word;
            line-height: 1.3;
        }

        .status-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.35rem 0.9rem;
            border-radius: var(--radius-full);
            letter-spacing: 0.3px;
            transition: all var(--transition);
        }

        .status-badge.done {
            background: #d1fae5;
            color: #065f46;
        }

        .status-badge.active {
            background: #fef3c7;
            color: #92400e;
        }

        .card-detail {
            margin: 1rem 0;
        }

        .detail-item {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            font-size: 0.95rem;
            margin-bottom: 0.7rem;
            flex-wrap: wrap;
        }

        .detail-label {
            font-weight: 700;
            min-width: 80px;
            color: var(--text-secondary);
        }

        .detail-value {
            color: var(--text-main);
            word-break: break-word;
            font-weight: 500;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.4rem;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .toggle-status-btn {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            padding: 0.55rem 1.3rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            color: var(--text-main);
            letter-spacing: 0.2px;
        }

        .toggle-status-btn:hover {
            background: #e0f2fe;
            border-color: #7dd3fc;
            transform: scale(1.02);
            box-shadow: 0 4px 10px rgba(56, 189, 248, 0.2);
        }

        .delete-btn {
            background: #fff1f0;
            border: 1px solid #fecaca;
            border-radius: var(--radius-full);
            padding: 0.55rem 1.3rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #b91c1c;
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 0.2px;
        }

        .delete-btn:hover {
            background: #fee2e2;
            border-color: #f87171;
            transform: scale(1.02);
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.2);
        }

        .created-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.9rem;
            text-align: right;
            font-weight: 500;
        }

        .empty-message {
            text-align: center;
            grid-column: 1 / -1;
            padding: 3.5rem;
            background: var(--surface-hover);
            border-radius: var(--radius-lg);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.3px;
            border: 1px dashed var(--border);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 1.2rem 1rem;
            }
            .hero h1 {
                font-size: 2.2rem;
            }
            .hero p {
                font-size: 0.95rem;
            }
            .form-card {
                padding: 1.5rem 1.2rem;
                border-radius: 24px;
            }
            .form-grid {
                gap: 1.2rem;
            }
            .input-group {
                min-width: 100%;
            }
            .btn-submit {
                width: 100%;
                justify-content: center;
            }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem 1.2rem;
            }
            .search-box {
                order: -1;
            }
            .search-box input {
                max-width: 100%;
            }
            .sort-box {
                order: 1;
            }
            .visualization-section {
                flex-direction: column;
                padding: 1.2rem;
                gap: 1.5rem;
            }
            .cards-grid {
                grid-template-columns: 1fr;
                gap: 1.2rem;
            }
            .record-card {
                padding: 1.4rem 1.2rem 1.2rem 1.4rem;
            }
            .activity-name {
                font-size: 1.2rem;
            }
            .stats-info {
                font-size: 0.8rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="hero">
        <h1>📋 活動報名 · 輕鬆管理</h1>
        <p>新增報名 | 狀態切換 | 即時篩選 | 搜尋活動 | 排序 | 圖表分析 | Google Sheet 同步</p>
    </div>

    <!-- 新增表單區 -->
    <div class="form-card">
        <div class="form-title">✨ 新增報名資料</div>
        <div class="form-grid">
            <div class="input-group">
                <label>📌 活動名稱 <span>*</span></label>
                <input type="text" id="activityName" placeholder="例：秋季登山健行" autocomplete="off">
            </div>
            <div class="input-group">
                <label>🏷️ 活動類別 <span>*</span></label>
                <select id="activityCategory">
                    <option value="運動戶外">運動戶外</option>
                    <option value="音樂藝術">音樂藝術</option>
                    <option value="講座課程">講座課程</option>
                    <option value="志工服務">志工服務</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="input-group">
                <label>📝 備註 / 人數限制 (可填)</label>
                <input type="text" id="activityNote" placeholder="例如：限20人，需自備水壺">
            </div>
        </div>
        <div style="display: flex; justify-content: flex-end;">
            <button class="btn-submit" id="createBtn">➕ 新增報名</button>
        </div>
    </div>

    <!-- 過濾器及統計 + 搜尋 + 排序 -->
    <div class="filter-bar">
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">📋 全部</button>
            <button class="filter-btn" data-filter="active">🟡 報名中 (active)</button>
            <button class="filter-btn" data-filter="done">✅ 已完成 (done)</button>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 搜尋活動名稱、類別或備註..." autocomplete="off">
        </div>
        <div class="sort-box">
            <select id="sortSelect">
                <option value="default">🔃 預設排序</option>
                <option value="nameAsc">活動名稱 A → Z</option>
                <option value="nameDesc">活動名稱 Z → A</option>
                <option value="timeNew">建立時間 新 → 舊</option>
                <option value="timeOld">建立時間 舊 → 新</option>
                <option value="statusActiveFirst">狀態：報名中優先</option>
                <option value="statusDoneFirst">狀態：已完成優先</option>
            </select>
        </div>
        <div class="stats-info" id="statsInfo">共 0 筆報名</div>
    </div>

    <!-- 📊 資料視覺化區塊 -->
    <section id="visualizationSection" class="visualization-section">
        <div class="chart-block bar-chart">
            <div class="chart-title">📂 各類別活動數量</div>
            <div id="categoryBars"></div>
        </div>
        <div class="chart-block pie-chart">
            <div class="chart-title">🍩 報名狀態分布</div>
            <canvas id="statusPieCanvas" width="200" height="200"></canvas>
            <div id="pieLegend" style="text-align: center; margin-top: 0.6rem; font-size:0.85rem;"></div>
        </div>
    </section>

    <!-- 卡片展示區 -->
    <div id="cardsContainer" class="cards-grid">
        <div class="empty-message">✨ 目前沒有任何報名，請新增活動報名～</div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // Google Apps Script 後端 URL
    // --------------------------------------------------------------
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEhIUlRDN-KJvEMEtcHzyRXksnRYd4I0t69nPWhJMfuzEirvaxuBkxPxylaf85yhcv/exec";

    // --------------------------------------------------------------
    // Data Contract (前端鍵)
    // --------------------------------------------------------------
    // id, createdAt, status, activityName, category, note

    // --------------------------------------------------------------
    // 全域變數
    // --------------------------------------------------------------
    let records = [];
    let currentFilter = "all";
    let searchQuery = "";
    let currentSort = "default";

    // DOM
    const activityNameInput = document.getElementById("activityName");
    const activityCategorySelect = document.getElementById("activityCategory");
    const activityNoteInput = document.getElementById("activityNote");
    const createBtn = document.getElementById("createBtn");
    const cardsContainer = document.getElementById("cardsContainer");
    const statsInfo = document.getElementById("statsInfo");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");

    // ---------- 輔助: 唯一 ID ----------
    function generateId() {
        return Date.now() + "_" + Math.random().toString(36).substring(2, 8);
    }

    // ---------- 1. createRecord ----------
    function createRecord(formData) {
        if (!formData.activityName || formData.activityName.trim() === "") {
            alert("請填寫活動名稱 (必填)");
            return null;
        }
        return {
            id: generateId(),
            createdAt: new Date().toISOString(),
            status: "active",
            activityName: formData.activityName.trim(),
            category: formData.category,
            note: formData.note || ""
        };
    }

    // ---------- 2. 本地儲存 (localStorage) ----------
    function saveData(record) {
        if (!record) return false;
        records.push(record);
        localStorage.setItem("records", JSON.stringify(records));
        return true;
    }

    function loadDataFromLocal() {
        const stored = localStorage.getItem("records");
        if (stored) {
            try {
                records = JSON.parse(stored);
                if (!Array.isArray(records)) records = [];
            } catch(e) {
                records = [];
            }
        } else {
            records = [];
        }
        return records;
    }

    // ---------- 3. Google Sheet 雙向對映 ----------
    function normalizeRecord(raw) {
        const map = {
            "ID": "id",
            "建立時間": "createdAt",
            "狀態": "status",
            "活動名稱": "activityName",
            "活動類別": "category",
            "備註": "note"
        };
        const record = {};
        Object.keys(raw).forEach(key => {
            const frontKey = map[key] || key;
            record[frontKey] = raw[key];
        });
        return record;
    }

    function toSheetRecord(frontendRecord) {
        const map = {
            "id": "ID",
            "createdAt": "建立時間",
            "status": "狀態",
            "activityName": "活動名稱",
            "category": "活動類別",
            "note": "備註"
        };
        const sheetRecord = {};
        Object.keys(frontendRecord).forEach(key => {
            const sheetKey = map[key] || key;
            sheetRecord[sheetKey] = frontendRecord[key];
        });
        return sheetRecord;
    }

    // ---------- 4. API 呼叫 ----------
    async function fetchRecordsFromSheet() {
        try {
            const res = await fetch(APPS_SCRIPT_URL);
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || "Fetch failed");
            return (data.records || []).map(normalizeRecord);
        } catch (err) {
            console.error("fetchRecordsFromSheet error:", err);
            throw err;
        }
    }

    async function syncToSheet(payload) {
        try {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || "Sync failed");
            return data;
        } catch (err) {
            console.error("syncToSheet error:", err);
            throw err;
        }
    }

    // ---------- 5. 更新本地 record ----------
    function updateRecord(id, changes) {
        const index = records.findIndex(record => record.id === id);
        if (index !== -1) {
            records[index] = { ...records[index], ...changes };
            localStorage.setItem("records", JSON.stringify(records));
            return true;
        }
        return false;
    }

    function deleteRecordById(id) {
        const newRecords = records.filter(record => record.id !== id);
        if (newRecords.length !== records.length) {
            records = newRecords;
            localStorage.setItem("records", JSON.stringify(records));
            return true;
        }
        return false;
    }

    // ---------- 6. 渲染 ----------
    function renderList(recordsToShow, customEmptyMessage) {
        cardsContainer.innerHTML = "";
        
        if (!recordsToShow || recordsToShow.length === 0) {
            const emptyDiv = document.createElement("div");
            emptyDiv.className = "empty-message";
            if (customEmptyMessage) {
                emptyDiv.innerText = customEmptyMessage;
            } else {
                emptyDiv.innerText = currentFilter === "all" ? "📭 目前沒有任何報名，請新增活動報名～" 
                                : (currentFilter === "active" ? "🟡 沒有進行中的報名，新增一筆吧！" : "✅ 沒有已完成報名，切換狀態試試～");
            }
            cardsContainer.appendChild(emptyDiv);
            updateStats();
            return;
        }
        
        for (let record of recordsToShow) {
            const card = document.createElement("div");
            card.className = "record-card";
            
            const statusDisplayText = record.status === "done" ? "✅ 已完成" : "🟡 報名中";
            const statusClass = record.status === "done" ? "status-badge done" : "status-badge active";
            
            let createdDateStr = "建立時間不明";
            try {
                const dateObj = new Date(record.createdAt);
                createdDateStr = `${dateObj.toLocaleDateString()} ${dateObj.toLocaleTimeString()}`;
            } catch(e) { createdDateStr = record.createdAt; }
            
            card.innerHTML = `
                <div class="card-header">
                    <div class="activity-name">${escapeHtml(record.activityName)}</div>
                    <div class="${statusClass}">${statusDisplayText}</div>
                </div>
                <div class="card-detail">
                    <div class="detail-item">
                        <span class="detail-label">🏷️ 類別：</span>
                        <span class="detail-value">${escapeHtml(record.category)}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">📝 備註：</span>
                        <span class="detail-value">${escapeHtml(record.note) || "— 無備註 —"}</span>
                    </div>
                </div>
                <div class="card-footer">
                    <button class="toggle-status-btn" data-id="${record.id}" data-status="${record.status}">
                        ${record.status === "active" ? "✔️ 標記為已完成" : "🔄 重啟報名"}
                    </button>
                    <button class="delete-btn" data-id="${record.id}">🗑️ 刪除</button>
                </div>
                <div class="created-time">
                    🕒 報名時間：${createdDateStr}
                </div>
            `;
            
            cardsContainer.appendChild(card);
        }
        
        document.querySelectorAll(".toggle-status-btn").forEach(btn => {
            btn.addEventListener("click", async (e) => {
                e.stopPropagation();
                const id = btn.getAttribute("data-id");
                const currentStatus = btn.getAttribute("data-status");
                const newStatus = currentStatus === "active" ? "done" : "active";
                const success = updateRecord(id, { status: newStatus });
                if (success) {
                    applyFilterAndRender();
                    try {
                        await syncToSheet({
                            action: "update",
                            id: id,
                            changes: toSheetRecord({ status: newStatus })
                        });
                    } catch (err) {
                        console.warn("狀態同步失敗，已保留本地修改", err);
                    }
                } else {
                    alert("更新狀態失敗");
                }
            });
        });
        
        document.querySelectorAll(".delete-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const id = btn.getAttribute("data-id");
                if (confirm("確定要刪除此筆報名嗎？")) {
                    deleteRecordById(id);
                    applyFilterAndRender();
                }
            });
        });
        
        updateStats();
    }
    
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function sortRecords(recordsArray) {
        const arr = [...recordsArray];
        switch (currentSort) {
            case "nameAsc":
                return arr.sort((a, b) => a.activityName.localeCompare(b.activityName, 'zh-Hant'));
            case "nameDesc":
                return arr.sort((a, b) => b.activityName.localeCompare(a.activityName, 'zh-Hant'));
            case "timeNew":
                return arr.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            case "timeOld":
                return arr.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
            case "statusActiveFirst":
                return arr.sort((a, b) => a.status === "active" ? -1 : 1);
            case "statusDoneFirst":
                return arr.sort((a, b) => a.status === "done" ? -1 : 1);
            default:
                return arr;
        }
    }
    
    function applyFilterAndRender() {
        let filtered = currentFilter === "all" ? [...records] :
                       currentFilter === "active" ? records.filter(r => r.status === "active") :
                       records.filter(r => r.status === "done");
        
        if (searchQuery.trim()) {
            const q = searchQuery.trim().toLowerCase();
            filtered = filtered.filter(rec => 
                (rec.activityName || "").toLowerCase().includes(q) ||
                (rec.category || "").toLowerCase().includes(q) ||
                (rec.note || "").toLowerCase().includes(q)
            );
        }
        
        filtered = sortRecords(filtered);
        
        const emptyMsg = (filtered.length === 0 && searchQuery.trim()) ? 
            `🔍 找不到與「${searchQuery.trim()}」相關的活動` : null;
        
        renderList(filtered, emptyMsg);
        drawVisualization();
    }
    
    function updateStats() {
        const total = records.length;
        const active = records.filter(r => r.status === "active").length;
        const done = records.filter(r => r.status === "done").length;
        statsInfo.innerHTML = `📊 總共 ${total} 筆  |  🟡 報名中 ${active}  |  ✅ 已完成 ${done}`;
    }

    function drawVisualization() {
        const barsContainer = document.getElementById("categoryBars");
        const canvas = document.getElementById("statusPieCanvas");
        const legend = document.getElementById("pieLegend");
        if (!barsContainer || !canvas) return;

        if (records.length === 0) {
            barsContainer.innerHTML = '<div class="no-data-message">尚無活動資料</div>';
            canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
            legend.innerHTML = '';
            return;
        }

        const cats = ["運動戶外", "音樂藝術", "講座課程", "志工服務", "其他"];
        const catCount = {};
        cats.forEach(c => catCount[c] = 0);
        records.forEach(r => {
            if (catCount.hasOwnProperty(r.category)) catCount[r.category]++;
            else catCount[r.category] = (catCount[r.category] || 0) + 1;
        });

        const max = Math.max(...Object.values(catCount), 1);
        barsContainer.innerHTML = cats.map(cat => {
            const cnt = catCount[cat];
            const pct = (cnt / max) * 100;
            return `<div class="bar-item">
                <span class="bar-label">${cat}</span>
                <div class="bar-track"><div class="bar-fill" style="width:${pct}%;">${cnt || ''}</div></div>
                <span class="bar-count">${cnt}</span>
            </div>`;
        }).join('');

        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const activeCnt = records.filter(r => r.status === "active").length;
        const doneCnt = records.filter(r => r.status === "done").length;
        const total = activeCnt + doneCnt;
        if (total === 0) {
            legend.innerHTML = '尚無活動';
            return;
        }
        const cx = canvas.width/2, cy = canvas.height/2, r = Math.min(canvas.width, canvas.height)*0.35;
        const slices = [{cnt: activeCnt, color: "#f59e0b"}, {cnt: doneCnt, color: "#10b981"}];
        let start = -Math.PI/2;
        slices.forEach(s => {
            const angle = (s.cnt/total)*2*Math.PI;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, start, start+angle);
            ctx.closePath();
            ctx.fillStyle = s.color;
            ctx.fill();
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2;
            ctx.stroke();
            start += angle;
        });
        ctx.beginPath();
        ctx.arc(cx, cy, r*0.5, 0, 2*Math.PI);
        ctx.fillStyle = "#fff";
        ctx.fill();
        
        legend.innerHTML = `<span style="display:inline-block;width:12px;height:12px;background:#f59e0b;border-radius:3px;margin-right:4px;"></span> 報名中 ${activeCnt} 筆
            <span style="display:inline-block;width:12px;height:12px;background:#10b981;border-radius:3px;margin-left:12px;margin-right:4px;"></span> 已完成 ${doneCnt} 筆`;
    }
    
    async function handleCreateRecord() {
        const name = activityNameInput.value;
        const cat = activityCategorySelect.value;
        const note = activityNoteInput.value;
        const newRec = createRecord({ activityName: name, category: cat, note });
        if (!newRec) return;
        saveData(newRec);
        activityNameInput.value = "";
        activityNoteInput.value = "";
        applyFilterAndRender();
        try {
            await syncToSheet({ action: "create", record: toSheetRecord(newRec) });
        } catch (err) {
            console.warn("同步失敗", err);
        }
        if (currentFilter === "done") {
            const tip = document.createElement("div");
            Object.assign(tip.style, {
                position:"fixed", bottom:"20px", left:"20px", background:"#1e293b", color:"white",
                padding:"8px 16px", borderRadius:"40px", fontSize:"0.8rem", zIndex:"999"
            });
            tip.innerText = "✨ 新增成功！目前篩選為「已完成」，可切換至「全部」查看新報名";
            document.body.appendChild(tip);
            setTimeout(() => tip.remove(), 2500);
        }
    }
    
    function bindFilterEvents() {
        document.querySelectorAll(".filter-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                currentFilter = e.target.dataset.filter;
                document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                applyFilterAndRender();
            });
        });
    }
    
    async function init() {
        bindFilterEvents();
        createBtn.addEventListener("click", handleCreateRecord);
        activityNameInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") { e.preventDefault(); handleCreateRecord(); }
        });
        searchInput.addEventListener("input", (e) => { searchQuery = e.target.value; applyFilterAndRender(); });
        sortSelect.addEventListener("change", (e) => { currentSort = e.target.value; applyFilterAndRender(); });
        
        try {
            records = await fetchRecordsFromSheet();
            localStorage.setItem("records", JSON.stringify(records));
        } catch (err) {
            console.warn("改用本地資料", err);
            loadDataFromLocal();
        }
        applyFilterAndRender();
    }
    
    init();
</script>
</body>
