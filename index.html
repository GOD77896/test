<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>活動報名小幫手 | 活動報名系統</title>
    <style>
        /* ---------- 原有樣式完全保留，未做任何修改 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f0f7ff 0%, #e9eef5 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }

        .hero h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .hero p {
            color: #4a627a;
            margin-top: 0.5rem;
            font-weight: 500;
        }

        .form-card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
            padding: 1.8rem 2rem;
            margin-bottom: 2rem;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .form-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e293b;
            border-left: 5px solid #3b82f6;
            padding-left: 1rem;
            margin-bottom: 1.5rem;
        }

        .form-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            margin-bottom: 1.8rem;
        }

        .input-group {
            flex: 1;
            min-width: 200px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #0f172a;
            font-size: 0.9rem;
        }

        .input-group label span {
            color: #ef4444;
            font-size: 0.8rem;
        }

        .input-group input, 
        .input-group select {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 20px;
            font-size: 0.95rem;
            transition: 0.2s;
            background: #fefefe;
        }

        .input-group input:focus, 
        .input-group select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }

        .btn-submit {
            background: #1e3c72;
            background: linear-gradient(95deg, #1e3c72, #2b4a8c);
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            box-shadow: 0 6px 14px rgba(0, 33, 68, 0.2);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            background: #0f2b4f;
            box-shadow: 0 12px 20px rgba(0,0,0,0.1);
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-radius: 60px;
            padding: 0.5rem 1rem;
            margin-bottom: 2rem;
            box-shadow: 0 5px 12px rgba(0,0,0,0.05);
        }

        .filter-buttons {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            color: #334155;
        }

        .filter-btn.active {
            background: #1e3c72;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .stats-info {
            background: #eef2ff;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1e293b;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.6rem;
        }

        .record-card {
            background: white;
            border-radius: 28px;
            padding: 1.4rem 1.2rem 1.2rem 1.5rem;
            box-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.12);
            transition: all 0.2s ease;
            border: 1px solid #eef2ff;
            position: relative;
            backdrop-filter: blur(2px);
        }

        .record-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 28px -12px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 0.5rem;
        }

        .activity-name {
            font-size: 1.3rem;
            font-weight: 800;
            color: #0c4e6e;
            word-break: break-word;
        }

        .status-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.3rem 0.7rem;
            border-radius: 50px;
            background: #e2e3e8;
            color: #2d3e5f;
        }

        .status-badge.done {
            background: #c7f9cc;
            color: #0a5c2e;
        }

        .status-badge.active {
            background: #ffe5b4;
            color: #b45309;
        }

        .card-detail {
            margin: 0.8rem 0;
        }

        .detail-item {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
        }

        .detail-label {
            font-weight: 700;
            min-width: 70px;
            color: #475569;
        }

        .detail-value {
            color: #1e293b;
            word-break: break-word;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .toggle-status-btn {
            background: none;
            border: 1px solid #cbd5e1;
            border-radius: 50px;
            padding: 0.4rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            background: #f8fafc;
        }

        .toggle-status-btn:hover {
            background: #eef2ff;
            transform: scale(0.97);
        }

        .delete-btn {
            background: #fff1f0;
            border: 1px solid #fecaca;
            border-radius: 50px;
            padding: 0.4rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #b91c1c;
            cursor: pointer;
            transition: 0.2s;
        }

        .delete-btn:hover {
            background: #fee2e2;
            border-color: #f87171;
        }

        .created-time {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 0.6rem;
            text-align: right;
        }

        .empty-message {
            text-align: center;
            grid-column: 1 / -1;
            padding: 3rem;
            background: #f1f5f9;
            border-radius: 48px;
            color: #5b6e8c;
            font-weight: 500;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
            .form-card {
                padding: 1.2rem;
            }
            .filter-bar {
                flex-direction: column;
                gap: 0.8rem;
                align-items: stretch;
                border-radius: 28px;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="hero">
        <h1>📋 活動報名 · 雲端同步版</h1>
        <p>新增報名 | 狀態切換 | 即時篩選 | 自動同步 Google Sheet</p>
    </div>

    <div class="form-card">
        <div class="form-title">✨ 新增報名資料</div>
        <div class="form-grid">
            <div class="input-group">
                <label>📌 活動名稱 <span>*</span></label>
                <input type="text" id="activityName" placeholder="例：秋季登山健行" autocomplete="off">
            </div>
            <div class="input-group">
                <label>🏷️ 活動類別 <span>*</span></label>
                <select id="activityCategory">
                    <option value="運動戶外">運動戶外</option>
                    <option value="音樂藝術">音樂藝術</option>
                    <option value="講座課程">講座課程</option>
                    <option value="志工服務">志工服務</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="input-group">
                <label>📝 備註 / 人數限制 (可填)</label>
                <input type="text" id="activityNote" placeholder="例如：限20人，需自備水壺">
            </div>
        </div>
        <div style="display: flex; justify-content: flex-end;">
            <button class="btn-submit" id="createBtn">➕ 新增報名</button>
        </div>
    </div>

    <div class="filter-bar">
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">📋 全部</button>
            <button class="filter-btn" data-filter="active">🟡 報名中 (active)</button>
            <button class="filter-btn" data-filter="done">✅ 已完成 (done)</button>
        </div>
        <div class="stats-info" id="statsInfo">共 0 筆報名</div>
    </div>

    <div id="cardsContainer" class="cards-grid">
        <div class="empty-message">✨ 目前沒有任何報名，請新增活動報名～</div>
    </div>
</div>

<script>
    // ---------- 1. 設定 Google Apps Script URL ----------
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby94opceU2SAq-hw3zPjpEDmpW6HzvGVtoiJ7RebNDzgnsjtwrdQrQYtBZq3ghH-fWhfw/exec";

    // ---------- 全域變數 ----------
    let records = [];            // 儲存所有報名物件
    let currentFilter = "all";  // all / active / done

    // DOM 元素
    const activityNameInput = document.getElementById("activityName");
    const activityCategorySelect = document.getElementById("activityCategory");
    const activityNoteInput = document.getElementById("activityNote");
    const createBtn = document.getElementById("createBtn");
    const cardsContainer = document.getElementById("cardsContainer");
    const statsInfo = document.getElementById("statsInfo");

    // ---------- Helper: 產生唯一ID ----------
    function generateId() {
        return Date.now() + "_" + Math.random().toString(36).substring(2, 8);
    }

    // ---------- Data Normalization: 將 Sheet 欄位對應回前端 key ----------
    function normalizeRecord(record) {
        // 根據 Data Contract 對應: 活動名稱 -> activityName, 類別 -> category, 備註 -> note
        return {
            id: record.id,
            createdAt: record.createdAt,
            status: record.status,
            activityName: record["活動名稱"] || record.activityName || "",  // 安全取值
            category: record["類別"] || record.category || "",
            note: record["備註"] || record.note || ""
        };
    }

    // ---------- 2. 新增 syncToSheet: 同步到 Google Sheet ----------
    async function syncToSheet(payload) {
        try {
            const response = await fetch(APPS_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors", // 為了避開 CORS 錯誤，使用 no-cors，無法讀取回應，但請求會送出
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            });
            // 因為 mode: 'no-cors' 無法讀取 response 內容，預設為成功
            console.log("Sync to Sheet attempted (no-cors mode)", payload);
        } catch (error) {
            console.warn("Sync to Sheet failed (network/online issue), but local data is saved.", error);
        }
    }

    // ---------- 3. 新增 fetchRecordsFromSheet: 從 Google Sheet 讀取資料 ----------
    async function fetchRecordsFromSheet() {
        try {
            const response = await fetch(APPS_SCRIPT_URL);
            if (!response.ok) throw new Error("HTTP error " + response.status);
            const data = await response.json();
            if (data && data.ok && Array.isArray(data.records)) {
                // 將每筆記錄標準化 (normalize)
                const normalizedRecords = data.records.map(record => normalizeRecord(record));
                // 更新全域 records 與 localStorage 作為備份
                records = normalizedRecords;
                localStorage.setItem("records", JSON.stringify(records));
                return true;
            } else {
                throw new Error("Invalid data format from sheet");
            }
        } catch (error) {
            console.warn("Failed to fetch from Google Sheet, fallback to localStorage", error);
            return false;
        }
    }

    // ---------- 4. 原有 createRecord (維持原樣) ----------
    function createRecord(formData) {
        if (!formData.activityName || formData.activityName.trim() === "") {
            alert("請填寫活動名稱 (必填)");
            return null;
        }
        return {
            id: generateId(),
            createdAt: new Date().toISOString(),
            status: "active",
            activityName: formData.activityName.trim(),
            category: formData.category,
            note: formData.note || ""
        };
    }

    // ---------- 5. saveData: 只儲存到 localStorage (原有邏輯不改，但會外部再同步) ----------
    function saveData(record) {
        if (!record) return false;
        records.push(record);
        localStorage.setItem("records", JSON.stringify(records));
        return true;
    }

    // ---------- 6. loadData: 優先讀 Sheet，失敗才讀 localStorage ----------
    async function loadData() {
        // 嘗試從 Google Sheet 讀取最新資料
        const success = await fetchRecordsFromSheet();
        if (!success) {
            // Fallback: 讀取 localStorage
            const stored = localStorage.getItem("records");
            if (stored) {
                try {
                    records = JSON.parse(stored);
                    if (!Array.isArray(records)) records = [];
                } catch(e) {
                    records = [];
                }
            } else {
                records = [];
            }
            localStorage.setItem("records", JSON.stringify(records));
        }
        return records;
    }

    // ---------- 7. updateRecord: 更新並同步到 Sheet ----------
    function updateRecord(id, changes) {
        const index = records.findIndex(record => record.id === id);
        if (index !== -1) {
            // 更新本地資料
            records[index] = { ...records[index], ...changes };
            localStorage.setItem("records", JSON.stringify(records));
            
            // 同步到 Google Sheet
            syncToSheet({
                action: "update",
                id: id,
                changes: changes
            });
            return true;
        }
        return false;
    }

    // ---------- 刪除功能 ----------
    function deleteRecordById(id) {
        const newRecords = records.filter(record => record.id !== id);
        if (newRecords.length !== records.length) {
            records = newRecords;
            localStorage.setItem("records", JSON.stringify(records));
            // 注意: 本題未要求刪除同步到 Sheet，但為了完整，可選擇實作
            // 若需刪除同步，可再呼叫 syncToSheet({ action: "delete", id });
            // 但原規格沒有，故先略。
            return true;
        }
        return false;
    }

    // ---------- renderList 完全保留 (未更動) ----------
    function renderList(recordsToShow) {
        cardsContainer.innerHTML = "";
        
        if (!recordsToShow || recordsToShow.length === 0) {
            const emptyDiv = document.createElement("div");
            emptyDiv.className = "empty-message";
            emptyDiv.innerText = currentFilter === "all" ? "📭 目前沒有任何報名，請新增活動報名～" 
                            : (currentFilter === "active" ? "🟡 沒有進行中的報名，新增一筆吧！" : "✅ 沒有已完成報名，切換狀態試試～");
            cardsContainer.appendChild(emptyDiv);
            updateStats();
            return;
        }
        
        for (let record of recordsToShow) {
            const card = document.createElement("div");
            card.className = "record-card";
            
            const statusDisplayText = record.status === "done" ? "✅ 已完成" : "🟡 報名中";
            const statusClass = record.status === "done" ? "status-badge done" : "status-badge active";
            
            let createdDateStr = "建立時間不明";
            try {
                const dateObj = new Date(record.createdAt);
                createdDateStr = `${dateObj.toLocaleDateString()} ${dateObj.toLocaleTimeString()}`;
            } catch(e) { createdDateStr = record.createdAt; }
            
            card.innerHTML = `
                <div class="card-header">
                    <div class="activity-name">${escapeHtml(record.activityName)}</div>
                    <div class="${statusClass}">${statusDisplayText}</div>
                </div>
                <div class="card-detail">
                    <div class="detail-item">
                        <span class="detail-label">🏷️ 類別：</span>
                        <span class="detail-value">${escapeHtml(record.category)}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">📝 備註：</span>
                        <span class="detail-value">${escapeHtml(record.note) || "— 無備註 —"}</span>
                    </div>
                </div>
                <div class="card-footer">
                    <button class="toggle-status-btn" data-id="${record.id}" data-status="${record.status}">
                        ${record.status === "active" ? "✔️ 標記為已完成" : "🔄 重啟報名"}
                    </button>
                    <button class="delete-btn" data-id="${record.id}">🗑️ 刪除</button>
                </div>
                <div class="created-time">
                    🕒 報名時間：${createdDateStr}
                </div>
            `;
            cardsContainer.appendChild(card);
        }
        
        document.querySelectorAll(".toggle-status-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const id = btn.getAttribute("data-id");
                const currentStatus = btn.getAttribute("data-status");
                const newStatus = currentStatus === "active" ? "done" : "active";
                if (updateRecord(id, { status: newStatus })) {
                    applyFilterAndRender();
                } else {
                    alert("更新狀態失敗");
                }
            });
        });
        
        document.querySelectorAll(".delete-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const id = btn.getAttribute("data-id");
                if (confirm("確定要刪除此筆報名嗎？")) {
                    deleteRecordById(id);
                    applyFilterAndRender();
                }
            });
        });
        
        updateStats();
    }
    
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function applyFilterAndRender() {
        let filtered = [];
        if (currentFilter === "all") {
            filtered = [...records];
        } else if (currentFilter === "active") {
            filtered = records.filter(rec => rec.status === "active");
        } else if (currentFilter === "done") {
            filtered = records.filter(rec => rec.status === "done");
        }
        renderList(filtered);
    }
    
    function updateStats() {
        const total = records.length;
        const activeCount = records.filter(r => r.status === "active").length;
        const doneCount = records.filter(r => r.status === "done").length;
        statsInfo.innerHTML = `📊 總共 ${total} 筆  |  🟡 報名中 ${activeCount}  |  ✅ 已完成 ${doneCount}`;
    }
    
    // ---------- 8. 修改 handleCreateRecord: 新增後同步到 Sheet ----------
    async function handleCreateRecord() {
        const formData = {
            activityName: activityNameInput.value,
            category: activityCategorySelect.value,
            note: activityNoteInput.value
        };
        const newRecord = createRecord(formData);
        if (newRecord) {
            // 儲存至 localStorage 與 records 陣列
            saveData(newRecord);
            
            // 同步到 Google Sheet
            await syncToSheet({
                action: "create",
                record: newRecord
            });
            
            // 清空表單
            activityNameInput.value = "";
            activityNoteInput.value = "";
            
            // 重新渲染
            applyFilterAndRender();
            
            if (currentFilter === "done") {
                const tip = document.createElement("div");
                tip.style.position = "fixed";
                tip.style.bottom = "20px";
                tip.style.left = "20px";
                tip.style.background = "#1e293b";
                tip.style.color = "white";
                tip.style.padding = "8px 16px";
                tip.style.borderRadius = "40px";
                tip.style.fontSize = "0.8rem";
                tip.style.zIndex = "999";
                tip.innerText = "✨ 新增成功！目前篩選為「已完成」，可切換至「全部」查看新報名";
                document.body.appendChild(tip);
                setTimeout(() => tip.remove(), 2500);
            }
        }
    }
    
    function bindFilterEvents() {
        const filterBtns = document.querySelectorAll(".filter-btn");
        filterBtns.forEach(btn => {
            btn.addEventListener("click", (e) => {
                const filterValue = btn.getAttribute("data-filter");
                if (filterValue) {
                    currentFilter = filterValue;
                    filterBtns.forEach(bt => bt.classList.remove("active"));
                    btn.classList.add("active");
                    applyFilterAndRender();
                }
            });
        });
    }
    
    async function init() {
        await loadData();          // 從 Sheet (或 localStorage) 載入資料
        bindFilterEvents();
        createBtn.addEventListener("click", handleCreateRecord);
        activityNameInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                handleCreateRecord();
            }
        });
        applyFilterAndRender();
    }
    
    init();
</script>
</body>
</html>
